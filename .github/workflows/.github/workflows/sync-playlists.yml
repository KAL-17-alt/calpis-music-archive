name: Auto Sync YouTube Playlists

on:
  schedule:
    # 毎日 04:00 JST (19:00 UTC) に自動実行
    - cron: '0 19 * * *'
  workflow_dispatch: # GitHubのActionsタブからいつでも手動実行可能

permissions:
  contents: write

jobs:
  sync-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run YouTube Playlist & Gemini AI Sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_PLAYLIST_IDS: ${{ secrets.YOUTUBE_PLAYLIST_IDS }}
        run: |
          python3 scripts/sync_youtube_playlists.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artists_master.json data/processed_videos.json data/pending_review.json data/auto_sync_log.json PENDING_REVIEW.md data.js || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-sync playlists and update pending review list"
            git push
          fi
